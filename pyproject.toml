[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["app/contracts.py", "app/models.py", "app/cancellation.py", "app/artifacts.py", "app/pipeline.py", "app/execution.py", "app/processor.py", "app/bootstrap.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
