baserow:
  api_url: https://api.baserow.io
  table_id: 0  # Numeric table ID from your Baserow table URL/API documentation
  images_table_id: 0  # Separate image table with an Image URL field
  api_key_env: BASEROW_API_TOKEN
downloads:
  timeout_seconds: 60
  max_file_mb: 256
cloudinary:
  cloud_name: ""  # From your Cloudinary dashboard
  api_key_env: CLOUDINARY_API_KEY
  api_secret_env: CLOUDINARY_API_SECRET
  folder: poetry-shorts
  chunk_mb: 10
  timeout_seconds: 120
whisper:
  model: ""  # Your provider's transcription model
  api_url: ""  # Full HTTPS transcription endpoint
  api_key_env: WHISPER_API_KEY
  language: null
  word_timestamps: true
  timeout_seconds: 120
video:
  width: 1080
  height: 1920
  fps: 30
  codec: libx264
  crf: 20
  preset: medium
  threads: 2
footage:
  minimum_words_for_new_clip: 3
  avoid_immediate_repetition: true
  random_seed: null
captions:
  font_name: Special Elite
  font_file: assets/fonts/SpecialElite-Regular.ttf
  font_size: 70
  color: '#FFFFFF'
  outline_color: '#000000'
  outline_width: 3
  position: center
  max_words_per_line: 5
  safe_margin: 80
  animation: word_by_word
  persist_during_silence: true
paths:
  buffer: buffer/voiceovers
  image_buffer: buffer/images
  output: output
  temp: temp
  logs: logs
server:
  host: 127.0.0.1
  port: 8000
