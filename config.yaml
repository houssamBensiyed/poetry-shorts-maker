google:
  credentials_file: credentials/service-account.json
  spreadsheet_id: ""
  worksheet_name: Sheet1
  output_drive_folder_id: ""
whisper:
  model: ""  # Your provider's transcription model
  api_url: ""  # Full HTTPS transcription endpoint
  api_key_env: WHISPER_API_KEY
  language: null
  word_timestamps: true
  timeout_seconds: 120
video:
  width: 1080
  height: 1920
  fps: 30
  codec: libx264
  crf: 20
  preset: medium
  threads: 2
footage:
  videos_directory: footage/videos
  images_directory: footage/images
  minimum_words_for_new_clip: 3
  avoid_immediate_repetition: true
  random_seed: null
captions:
  font_name: Special Elite
  font_file: assets/fonts/SpecialElite-Regular.ttf
  font_size: 70
  color: '#FFFFFF'
  outline_color: '#000000'
  outline_width: 3
  position: center
  max_words_per_line: 5
  safe_margin: 80
  animation: word_by_word
  persist_during_silence: true
paths:
  output: output
  temp: temp
  logs: logs
server:
  host: 127.0.0.1
  port: 8000
