name: Python checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests devtools/video_test api.py main.py
      - name: Check formatting
        run: ruff format --check app tests devtools/video_test api.py main.py
      - name: Check application interfaces
        run: mypy
      - name: Check dev-tool JavaScript
        run: node --check devtools/video_test/static/app.js
      - name: Test
        run: python -m pytest -q tests devtools/video_test/tests
