x-common: &common
  image: poetry-shorts-maker:local
  build: .
  init: true
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment: &environment
    BASEROW_API_TOKEN: "${BASEROW_API_TOKEN:-}"
    CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
    CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
    WHISPER_API_KEY: "${WHISPER_API_KEY:-}"
    VIDEO_BUILDER_API_KEY: "${VIDEO_BUILDER_API_KEY:-}"
  volumes:
    - ./config.yaml:/app/config.yaml:ro
    - ./buffer:/app/buffer
    - ./output:/app/output
    - ./temp:/app/temp
    - ./logs:/app/logs
    - processing-locks:/tmp/poetry-video-builder-locks
  # Let an in-flight transcription request reach its configured 120s timeout.
  stop_grace_period: 180s

services:
  worker:
    <<: *common
    profiles: [worker]
    command: [python, -m, app.buffer, run, --watch]

  automations:
    <<: *common
    profiles: [automations]
    command: [python, -m, app.automations, --watch]

  dashboard:
    <<: *common
    profiles: [dashboard]
    stdin_open: true
    tty: true
    command: [python, main.py]

  api:
    <<: *common
    profiles: [api]
    environment:
      <<: *environment
      VIDEO_BUILDER_HOST: 0.0.0.0
      VIDEO_BUILDER_PORT: "8000"
    command: [python, api.py]
    ports:
      - "127.0.0.1:${VIDEO_BUILDER_HTTP_PORT:-8000}:8000"


volumes:
  processing-locks:
